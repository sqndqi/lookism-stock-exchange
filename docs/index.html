<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lookism Character Stocks</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">r/lookismcomic market feed</p>
        <h1>Lookism Character Stocks</h1>
      </div>
      <div class="market-clock">
        <span>Last update</span>
        <strong id="last-update">Loading</strong>
      </div>
    </header>

    <main>
      <section class="ticker" id="ticker" aria-label="Top movers"></section>

      <section class="controls" aria-label="Market controls">
        <label class="search">
          <span>Search</span>
          <input id="search" type="search" placeholder="Daniel, Gun, James...">
        </label>
        <button class="chip active" type="button" data-filter="all">All</button>
        <button class="chip" type="button" data-filter="up">Up</button>
        <button class="chip" type="button" data-filter="down">Down</button>
      </section>

      <section class="summary-grid" id="summary"></section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Character</th>
              <th>Price</th>
              <th>Change</th>
              <th>Mentions</th>
              <th>Sentiment</th>
              <th>Signal</th>
            </tr>
          </thead>
          <tbody id="stock-table"></tbody>
        </table>
      </section>
    </main>

    <template id="row-template">
      <tr>
        <td>
          <strong class="character"></strong>
          <span class="reason"></span>
        </td>
        <td class="price"></td>
        <td class="change"></td>
        <td class="mentions"></td>
        <td>
          <meter min="-1" max="1" value="0"></meter>
        </td>
        <td class="signal"></td>
      </tr>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
